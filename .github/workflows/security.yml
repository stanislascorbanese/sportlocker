# Security scans — séparé de ci.yml pour deux raisons :
#   1. Cadence différente : ces checks tournent aussi en cron hebdomadaire
#      pour détecter les CVE qui sortent après merge (un package safe au
#      moment du merge peut devenir vulnérable 2 semaines plus tard).
#   2. Lisibilité GitHub Actions : on veut un check "security" distinct du
#      check "build/test" dans le statut de PR.
#
# Référencé par docs/SECURITY.md §9 items #7 (audit deps) et #8 (secret scan).

name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Tous les lundis 06:00 UTC (cron hebdomadaire). Détecte les CVE
    # publiées entre deux PR.
    - cron: '0 6 * * 1'

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Scan secrets — regex sur le diff vs main + diff staged + tracked files
  # ────────────────────────────────────────────────────────────────────────
  # On réutilise scripts/preflight.sh --secrets (la même source de vérité
  # qu'en local). Pas de dépendance externe (gitleaks payant sur repos
  # privés), patterns maintenus à un seul endroit.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: Checkout (avec historique pour diff vs main)
        uses: actions/checkout@v6
        with:
          # fetch-depth: 0 → tout l'historique. Nécessaire pour que `git diff`
          # voie les commits entre la PR et main (sans ça, depth=1 = juste HEAD).
          fetch-depth: 0

      - name: Vérification du script
        run: |
          test -x scripts/preflight.sh || {
            echo "scripts/preflight.sh manquant ou non-exécutable"
            exit 1
          }

      - name: Scan secrets (preflight --secrets)
        run: bash scripts/preflight.sh --secrets

  # ─── Audit deps Node — pnpm audit level=high
  # ────────────────────────────────────────────────────────────────────────
  # pnpm audit retourne non-zero quand il trouve >= 1 vuln au niveau demandé.
  # On choisit `high` (vs `critical`) pour avoir une marge : une vuln high
  # non patchée pendant 30j est inacceptable pour un service traitant des
  # données citoyens.
  #
  # Job HARD : fail la PR si une vuln ≥ high apparaît, hors GHSAs explicitement
  # tracées dans docs/SECURITY.md. Au 2026-06, UNE seule GHSA ignorée
  # (GHSA-gv7w-rqvm-qjhr / esbuild — cf. SECURITY.md §9 item #17) : le patch
  # 0.28.1 casse `astro check`, le fix réel est le bump Astro/Vite à venir.
  # Toutes les autres vulns ≥ high sont résolues (overrides + upgrades).
  # pnpm 9 n'applique pas `pnpm.auditConfig.ignoreCves` donc le filtrage via jq.
  #
  # Pour ajouter une exception : la mettre dans `IGNORED_GHSAS` ci-dessous ET
  # créer un item dans docs/SECURITY.md §9 — pas de date silencieuse.
  audit-node:
    name: audit deps (node)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node 20
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Activate pnpm 9.0.0
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate

      # pnpm audit n'a pas besoin de pnpm install — il lit pnpm-lock.yaml
      # et appelle directement le registry npm. Beaucoup plus rapide qu'un
      # install complet.
      - name: pnpm audit (high+critical, hors GHSAs tracées)
        env:
          # GHSAs ignorées — chacune doit avoir un item de suivi dans
          # docs/SECURITY.md §9 avec date cible et raison.
          # GHSA-gv7w-rqvm-qjhr : esbuild (transitif via Vite/Astro). Seule 0.28.1
          # patche, mais elle casse `astro check` sur la cible navigateurs actuelle —
          # le fix réel = bump Astro/Vite (cf. SECURITY.md §9 item #17). Advisory
          # dev-tooling (intégrité binaire du module Deno via NPM_CONFIG_REGISTRY),
          # non exploitable au runtime de l'app.
          # GHSA-8hv8-536x-4wqp / GHSA-2pvr-wf23-7pc7 : astro (XSS slot non échappé /
          # SSRF Host header sur error page prerender). Patch UNIQUEMENT en Astro 6.x
          # (>=6.3.3 / >=6.4.6) ; on reste en Astro 5 car 6 exige Node >=22.12 alors
          # que la CI tourne en Node 20 (cf. §9 #14). Risque réel faible : apps/web est
          # `output: static` (pas de SSR/slot dynamique côté requête). Fix = migration
          # Astro 6 + Node 22 (cf. §9 item #18).
          # GHSA-26w7-cxv4-gfx2 : astro (RCE via l'optimisation d'images AVIF).
          # Critique, et sans correctif en Astro 5 — patch >=7.2.8 seulement, or
          # Astro 6+ exige Node >=22.12 quand la CI tourne en Node 20 (cf. §9 #14).
          # Exposition réelle nulle en l'état : apps/web est `output: static`,
          # l'optimisation d'images s'exécute au build sur des fichiers du dépôt,
          # jamais à la requête sur une image fournie par un visiteur. Le vecteur
          # de l'advisory — un AVIF hostile passé au pipeline — n'existe pas ici.
          # Levée avec la migration Astro 6/7 + Node 22 (cf. §9 item #18).
          # GHSA-83w8-p2f5-377r : @fastify/static (contournement de garde de route
          # par traversee de chemin). Patch a partir de 10.1.1, mais le paquet est
          # TRANSITIF — seul @fastify/swagger-ui@5.2.6 le tire, et il declare
          # `@fastify/static: ^9.1.2`. Un override vers 10.x le sortirait de sa plage
          # testee, ce qui est exactement ce qui a casse la CI en juin (cf. SECURITY.md
          # §9 item #19). Le chemin propre est de monter @fastify/swagger-ui en 6.1.1,
          # qui declare lui-meme `^10.1.0` — bump majeur d'une dependance directe de
          # l'API, donc sa propre PR avec les tests api verts (cf. §9 item #21).
          # ATTENTION : contrairement aux autres exceptions de cette liste, celle-ci
          # est reellement atteignable — /docs est publique et sans authentification.
          # A traiter en priorite, pas a laisser dormir.
          # GHSA-52cp-r559-cp3m / GHSA-5p4m-2wfm-xmqj / GHSA-2883-xcg3-v3hh : js-yaml
          # (DoS CPU quadratique sur les clés de fusion YAML). Pas de bump possible :
          # `js-yaml` est EPINGLE a 4.1.1 dans package.json#pnpm.overrides, et c'est
          # deliberé — 4.2.0 a retiré l'export par defaut du build ESM, or
          # @astrojs/markdown-remark fait `import yaml from 'js-yaml'`. Des 4.2.0,
          # `astro check` ne demarre plus (verifie en depaquetant 4.1.1, 4.2.0, 4.3.0
          # et 4.3.2 — cf. SECURITY.md §9 item #19, ou un bump a deja casse la CI).
          # Exposition reelle nulle : js-yaml ne lit ici que le frontmatter du depot
          # au build, jamais du YAML fourni par un visiteur. A lever quand Astro sera
          # passe aux imports nommes (cf. §9 item #20).
          # GHSA-f88m-g3jw-g9cj / GHSA-rgj7-g3m4-5g8c : sharp (vulns heritees de
          # libvips et libheif). Patch a partir de 0.35.0, mais astro@5.18.2 declare
          # `sharp: ^0.34.0` en optionalDependency : forcer 0.35.x sortirait de la
          # plage testee par Astro, sur le paquet qui genere justement les images du
          # site. Meme raisonnement d'exposition que l'advisory AVIF ci-dessus :
          # apps/web est `output: static`, l'optimisation tourne au build sur des
          # fichiers du depot. A lever avec la montee Astro (cf. §9 item #18).
          IGNORED_GHSAS: 'GHSA-gv7w-rqvm-qjhr GHSA-8hv8-536x-4wqp GHSA-2pvr-wf23-7pc7 GHSA-26w7-cxv4-gfx2 GHSA-52cp-r559-cp3m GHSA-5p4m-2wfm-xmqj GHSA-2883-xcg3-v3hh GHSA-f88m-g3jw-g9cj GHSA-rgj7-g3m4-5g8c GHSA-83w8-p2f5-377r'
        run: |
          set -euo pipefail
          # On laisse pnpm audit retourner non-zéro (présence de vulns) sans
          # faire planter le job — on analysera la sortie nous-mêmes.
          pnpm audit --audit-level=high --json > audit.json || true

          filter=''
          for ghsa in $IGNORED_GHSAS; do
            filter="$filter | select(.github_advisory_id != \"$ghsa\")"
          done

          remaining=$(jq -r "
            [.advisories[]
              | select(.severity == \"high\" or .severity == \"critical\")
              $filter
              | \"\(.severity) \(.module_name) (\(.github_advisory_id)) — \(.title)\"
            ]
          " audit.json)

          count=$(echo "$remaining" | jq 'length')
          if [ "$count" -gt 0 ]; then
            echo "::error::$count vulnérabilité(s) ≥ high non tracées :"
            echo "$remaining" | jq -r '.[]'
            echo ""
            echo "Pour ajouter une exception : voir IGNORED_GHSAS dans .github/workflows/security.yml + docs/SECURITY.md §9."
            exit 1
          fi
          echo "Audit OK — 0 vulnérabilité ≥ high hors GHSAs tracées."

  # ─── Audit deps Python firmware — pip-audit
  # ────────────────────────────────────────────────────────────────────────
  # Équivalent pnpm audit pour le firmware. Lit requirements.txt + lockfile
  # et croise avec la DB OSV/PyPI Advisory.
  audit-python:
    name: audit deps (python firmware)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      # setuptools est fourni par l'image du runner, pas par nos requirements :
      # la 79.0.1 livree par defaut porte PYSEC-2026-3447, corrigee en 83.0.0.
      # On le monte ici plutot que de l'epingler dans requirements.txt, ou il
      # n'a rien a faire — le firmware ne l'importe pas, c'est un outil de build.
      - name: Install pip-audit (et setuptools a jour)
        run: pip install -U pip setuptools pip-audit

      - name: pip-audit (firmware)
        working-directory: services/firmware
        # --requirement plutôt que --strict pour ne pas bloquer sur les
        # warnings transitifs (deps de deps). On bloque sur les CVE
        # confirmées seulement.
        #
        # PYSEC-2026-1325 : ecdsa, tire transitivement par
        # python-jose[cryptography]. **Aucune version corrigee n'existe** en
        # amont — ce n'est donc pas un bump qu'on repousse, il n'y a rien a
        # installer. Et le code ne l'atteint jamais : le firmware ne verifie
        # que des JWT **HS256** (`jwt_verify.py`, JWT_ALGORITHM = "HS256"),
        # un HMAC. Aucune signature a courbe elliptique n'est produite ni
        # verifiee sur la borne, donc le chemin de code vulnerable n'est
        # jamais execute. A retirer si une version corrigee parait, ou le jour
        # ou le firmware passerait a un algorithme asymetrique (cf. §9 #22).
        run: |
          pip-audit --requirement requirements.txt --ignore-vuln PYSEC-2026-1325 \
            || pip-audit --ignore-vuln PYSEC-2026-1325
